<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Admin - Emergency Medical Portal</title>
    <!-- Centrale layout -->
    <link rel="stylesheet" href="../css/main.css">
    <!-- Extra styling voor contact pagina -->
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="../img/logo_emp.png" alt="Logo" class="logo-img"> 
            Emergency Medical Portal
        </div>
        <div class="user-box">
            <a href="../index.html" class="btn">Home</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="title-card">
            <h1>Contact Admin</h1>
            <p>Heb je vragen of wil je ondersteuning? Neem gerust contact met ons op.</p>
        </section>

        <section class="contact-section">
            <div class="contact-card">
                <h2>Email</h2>
                <p><a href="mailto:webadmin@emergencyportal.com">webadmin@emergencyportal.com</a></p>
            </div>

            <div class="contact-card">
                <h2>Telefoon</h2>
                <p><a href="tel:+5971234567">+597 1234567</a></p>
            </div>

            <div class="contact-card">
                <h2>Adres</h2>
                <p>Paramaribo, Suriname</p>
            </div>

            <div class="contact-card">
                <h2>Supportformulier</h2>
                <form class="contact-form">
                    <input type="text" placeholder="Naam" required>
                    <input type="email" placeholder="Email" required>
                    <textarea placeholder="Bericht" rows="4" required></textarea>
                    <button type="submit" class="btn signup">Verstuur</button>
                </form>
            </div>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Emergency Medical Portal | 
           <a href="privacy_policy.html">Privacy Policy</a> | 
           <a href="terms.html">Terms</a> | 
           <a href="contact.html">Contact Admin</a>
        </p>
    </footer>

</body>
</html>
