<!DOCTYPE html>
<html lang="en">

{{head}}
<head>
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>

    {{header}}

    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="title-card">
            <h1>Login</h1>
            <p>Log in om toegang te krijgen tot jouw medische gegevens.</p>
        </section>

        <form class="form-box">
            <label>Email</label>
            <input type="email" placeholder="Voer je email in" required>

            <label>Wachtwoord</label>
            <input type="password" placeholder="Voer je wachtwoord in" required>

            <button type="submit" class="btn login">Login</button>
            <a href="#" class="forgot-link">Wachtwoord vergeten?</a>
        </form>
    </main>

    {{footer}}

</body>
</html>
