<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Emergency Medical Portal</title>
    <!-- Centrale layout -->
    <link rel="stylesheet" href="../../css/main.css">
    <!-- Extra styling voor login/signup -->
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>


    <!-- NAVBAR -->
    <header class="navbar">
        <div class="logo">
            <img src="../../img/logo_emp.png" alt="Logo" class="logo-img"> 
            Emergency Medical Portal
        </div>
        <div class="user-box">
            <a href="../../index.html" class="btn">Home</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="title-card">
            <h1>Sign Up</h1>
            <p>Maak een nieuw account aan om gebruik te maken van het portaal.</p>
        </section>

        <form class="form-box">
            <label>Naam</label>
            <input type="text" placeholder="Voer je naam in" required>

            <label>Email</label>
            <input type="email" placeholder="Voer je email in" required>

            <label>Wachtwoord</label>
            <input type="password" placeholder="Maak een wachtwoord" required>

            <button type="submit" class="btn signup">Sign Up</button>
        </form>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>© 2026 Emergency Medical Portal | 
           <a href="privacy.html">Privacy Policy</a> | 
           <a href="terms.html">Terms</a> | 
           <a href="contact.html">Contact Admin</a>
        </p>
    </footer>

</body>
</html>
