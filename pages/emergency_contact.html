<!DOCTYPE html>
<html lang="en">

{{head}}
<head>
 <link rel="stylesheet" href="../css/emergency_contact.css">
</head>
<body>

    {{header}}


    <!-- MAIN CONTENT -->
    <main class="container">
        <section class="title-card">
            <h1>Emergency Contact</h1>
            <p>Belangrijke noodnummers en contactinformatie voor directe hulp.</p>
        </section>

        <section class="emergency-section">

            <div class="emergency-card">
                <h2>Centrale Ambulance dienst</h2>
                <p><strong>117</strong></p>
                <a href="tel:117" class="call-btn">Bel Ambulance</a>
            </div>

            <div class="emergency-card">
                <h2>Korps Brandweer Suriname</h2>
                <p><strong>110</strong></p>
                <a href="tel:110" class="call-btn">Bel Brandweer</a>
            </div>

            <div class="emergency-card">
                <h2>Korps Politie Suriname</h2>
                <p><strong>115</strong></p>
                <a href="tel:115" class="call-btn">Bel Politie</a>
            </div>
        </section>
    </main>

  {{footer}}

</body>
</html>
