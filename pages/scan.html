<!DOCTYPE html>
<html lang="en">
    {{head}}
<body>

    {{header}}

    <!-- MAIN -->

    <div class="container">

        <div class="title-card">

            <h1>Patient Card Scanner</h1>

            <p>
                Scan ID card or SZF card to automatically retrieve patient data.
            </p>

        </div>

        <div class="scan-wrapper">

            <!-- LEFT -->

            <div class="scanner-card">

                <div class="camera-box">

                    <video id="video" autoplay playsinline></video>

                    <div class="scan-overlay"></div>

                </div>

                <div class="controls">

                    <button class="start-btn" onclick="startScanning()">
                        Start Scan
                    </button>

                    <button class="stop-btn" onclick="stopScanning()">
                        Stop Scan
                    </button>

                    <button class="upload-btn" onclick="openUpload()">
                        Upload Card
                    </button>

                </div>

                <input
                    type="file"
                    id="imageUpload"
                    accept="image/*"
                    capture="environment"
                    style="display:none"
                >

            </div>

            <!-- RIGHT -->

            <div class="side-panel">

                <h2>Detected Result</h2>

                <div class="result-box">

                    <div class="result-title">
                        Best Matching Value
                    </div>

                    <div class="result-value" id="finalResult">
                        Waiting...
                    </div>

                </div>

                <div class="result-box">

                    <div class="result-title">
                        Status
                    </div>

                    <div class="result-value" id="statusText">
                        Idle
                    </div>

                </div>

                <img id="previewImage">

                <div class="logs" id="logs"></div>

            </div>

        </div>

    </div>

    <!-- HIDDEN CANVAS -->

    <canvas id="canvas" style="display:none;"></canvas>
<script src="/js/scan.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
{{footer}}
</body>
</html>
