<!DOCTYPE html>
<html lang="en">

{{head}}
<body>
    {{header}}

<section class="my-profile-container">

    <!-- PROFILE HEADER -->
    <div class="my-profile-header">

        <img src="/img/user.jpg" alt="My Photo" class="my-profile-img">

        <div class="my-profile-info">
            <h1 id="profile-name">...</h1>
            <p class="role" id="profile-role">...</p>
            <div class="status active">Online / Actief</div>
        </div>

    </div>

    <!-- GRID -->
    <div class="my-profile-grid">

        <!-- PERSONAL INFO -->
        <div class="card">
            <h2>Persoonlijke Gegevens</h2>
            <p><strong>Naam:</strong> <span id="profile-name-detail">-</span></p>
            <p><strong>Email:</strong> <span id="profile-email">-</span></p>
            <p><strong>Telefoon:</strong> <span id="profile-phone">-</span></p>
            <p><strong>Adres:</strong> <span id="profile-address">-</span></p>
            <p><strong>Geboortedatum:</strong> <span id="profile-dob">-</span></p>
            <p><strong>Geslacht:</strong> <span id="profile-gender">-</span></p>
        </div>

        <!-- MEDICAL INFO -->
        <div class="card">
            <h2>Medische Informatie</h2>
            <p><strong>Bloedgroep:</strong> <span id="profile-blood-type">-</span></p>
        </div>

        <!-- SECURITY / ACCESS -->
        <div class="card">
            <h2>Toegang & Rollen</h2>
            <div class="tags">
                <span class="tag" id="profile-role-tag">-</span>
            </div>
            <p class="note">Deze rollen bepalen welke pagina's je kunt openen.</p>
        </div>

    </div>

</section>

{{footer}}

<script src="/js/profile.js"></script>
</body>
</html>
